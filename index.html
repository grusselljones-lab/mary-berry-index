<style>
:root{--bg:#fbfaf7;--fg:#1f1f1c;--muted:#6b6a63;--line:#dcdad2;--card:#fff;--accent:#7a2e3a}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--fg:#ecebe5;--muted:#a09f96;--line:#33322d;--card:#1f1f1c;--accent:#e0a3ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.4rem;margin:8px 0 12px}
input[type=search]{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
input[type=search]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.books{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
select{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);max-width:100%}
button{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button[aria-pressed=true]{color:#171715}}
#count{color:var(--muted);font-size:.9rem;margin:4px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.t{flex:1;min-width:0}
.b{display:block;color:var(--muted);font-size:.85rem}
.s{flex:none;width:44px;height:44px;margin:-6px 0 -6px -8px;padding:0;border:0;border-radius:50%;background:none;font-size:1.5rem;line-height:1;color:var(--muted)}
.s[aria-pressed=true]{background:none;color:var(--accent)}
.fav{margin:0 0 0 auto}
.p{white-space:nowrap;font-weight:bold;color:var(--accent);text-align:right}
/* Zoe score */
.sc{flex:none;min-width:36px;height:28px;padding:0 5px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;font-size:.78rem;color:var(--muted);cursor:pointer;text-align:center;line-height:26px}
.sc.z1,.sc.z2,.sc.z3,.sc.z4{font-weight:bold;border-color:transparent}
.z1{background:#1e8e3e!important;color:#fff!important}
.z2{background:#7bc67b!important;color:#10331a!important}
.z3{background:#f2cf3d!important;color:#3a3000!important}
.z4{background:#e8912d!important;color:#3a1f00!important}
.ms{position:relative}
.ms[hidden]{display:none}
.ms summary{list-style:none;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;user-select:none}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:" \25BE";color:var(--muted)}
.ms[open] summary{border-color:var(--accent)}
.ms .opts{position:absolute;z-index:10;top:100%;left:0;margin-top:4px;min-width:220px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ms label{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:.9rem;cursor:pointer}
.ms input{width:18px;height:18px;accent-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.sc-wrap{flex:none;display:flex;align-items:center;gap:4px}
.sc-clr{width:28px;height:28px;padding:0;border-radius:50%;font-size:1rem;line-height:1;color:var(--muted)}
.sc-inp{width:42px;height:28px;border:2px solid var(--accent);border-radius:12px;text-align:center;font:inherit;font-size:.78rem;color:var(--fg);background:var(--card);padding:0;-moz-appearance:textfield}
.sc-inp::-webkit-inner-spin-button,.sc-inp::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>

};
const SYN={shrimp:"prawn",prawns:"shrimp",eggplant:"aubergine",zucchini:"courgette",cilantro:"coriander",garbanzo:"chickpea",scallion:"spring onion",arugula:"rocket",mince:"beef",molasses:"treacle",biscuit:"cookie",cookie:"biscuit"};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['']/g,"").replace(/[^a-z0-9 ]+/g," ");
const stem=w=>w.length<4?w:/ies$/.test(w)?w.slice(0,-3)+"y":/oes$/.test(w)?w.slice(0,-2):/ss$/.test(w)?w:w.replace(/s$/,"");
const ALL=[];
for(const [code,txt] of Object.entries(DATA)){
  txt.trim().split("\n").forEach(l=>{
    const [page,title,extra=""] = l.split("|");
    const hay=norm(title+" "+extra).split(/\s+/).map(stem).join(" ");
    ALL.push({code,page,title,hay,id:code+'|'+page+'|'+title});
  });
}
ALL.sort((a,b)=>a.title.localeCompare(b.title)||a.code.localeCompare(b.code));

let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("mb-favs")||"[]"))}catch(e){}
function saveFavs(){try{localStorage.setItem("mb-favs",JSON.stringify([...favs]))}catch(e){}}

let scores={};
try{scores=JSON.parse(localStorage.getItem("mb-scores")||"{}")}catch(e){}
function saveScores(){try{localStorage.setItem("mb-scores",JSON.stringify(scores))}catch(e){}}

let favOnly=false, zoeOnly=false;
const selAuthors=new Set(), selBooks=new Set(), selBands=new Set();
const band=n=>n>=85?1:n>=55?2:n>=25?3:4;
const BANDS=[["1","Dark green 85-99","#1e8e3e"],["2","Light green 55-84","#7bc67b"],["3","Yellow 25-54","#f2cf3d"],["4","Amber 0-24","#e8912d"]];
const q=document.getElementById("q"),res=document.getElementById("results"),cnt=document.getElementById("count");

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function render(){
  const terms=norm(q.value).split(/\s+/).filter(Boolean).map(stem);
  let rows=ALL.map((r,i)=>({...r,i})).filter(r=>
    (!favOnly||favs.has(r.id))&&
    (!zoeOnly||scores[r.id]!==undefined)&&
    (!selAuthors.size||selAuthors.has(BOOKS[r.code].a))&&
    (!selBooks.size||selBooks.has(r.code))&&
    (!zoeOnly||!selBands.size||selBands.has(String(band(scores[r.id]))))&&
    terms.every(t=>r.hay.includes(t)||(SYN[t]&&r.hay.includes(stem(SYN[t]))))
  );
  if(zoeOnly) rows.sort((a,b)=>(scores[b.id]??-1)-(scores[a.id]??-1));
  cnt.textContent=rows.length+(rows.length===1?" recipe":" recipes");
  const fb=document.getElementById("favbtn");
  fb.textContent="★ Favourites ("+favs.size+")";
  fb.setAttribute("aria-pressed",favOnly);
  const zb=document.getElementById("zoebtn");
  zb.textContent="Zoe ("+Object.keys(scores).length+")";
  zb.setAttribute("aria-pressed",zoeOnly);
  document.getElementById("bandDD").hidden=!zoeOnly;
  const scored=Object.keys(scores).length;
  res.innerHTML=rows.map(r=>{
    const sv=scores[r.id];
    const hasScore=sv!==undefined;
    return `<li><button class="s" data-i="${r.i}" aria-pressed="${favs.has(r.id)}" aria-label="${favs.has(r.id)?'Remove from favourites':'Add to favourites'}">${favs.has(r.id)?'★':'☆'}</button><span class="t">${esc(r.title)}<span class="b">${esc(BOOKS[r.code].n)}, ${esc(BOOKS[r.code].a)}</span></span><button class="sc${hasScore?' z'+band(sv):''}" data-i="${r.i}" aria-label="Zoe score">${hasScore?sv:'+'}</button><span class="p">p.&nbsp;${r.page}</span></li>`;
  }).join("")||(favOnly&&!favs.size?"<li>No favourites yet. Tap the star next to a recipe to add it.</li>":zoeOnly?"<li>No Zoe scores yet. Tap + next to any recipe to add one.</li>":"<li>No matches. Try a shorter word, or turn on more books.</li>");
}

function buildMS(el,allLabel,noun,getItems,sel,onChange){
  const sum=el.querySelector("summary"),box=el.querySelector(".opts");
  function draw(){
    const items=getItems();
    for(const v of [...sel]) if(!items.some(i=>i[0]===v)) sel.delete(v);
    box.innerHTML=items.map(([v,l,c])=>`<label><input type="checkbox" value="${esc(v)}"${sel.has(v)?' checked':''}>${c?`<i class="sw" style="background:${c}"></i>`:''}${esc(l)}</label>`).join("");
    sum.textContent=sel.size===0?allLabel:sel.size===1?items.find(i=>i[0]===[...sel][0])[1]:sel.size+" "+noun;
  }
  box.addEventListener("change",e=>{const v=e.target.value;if(e.target.checked)sel.add(v);else sel.delete(v);draw();onChange();});
  draw();
  return draw;
}
const AUTHORS=[...new Set(Object.values(BOOKS).map(b=>b.a))].sort();
const drawBooks=buildMS(document.getElementById("bookDD"),"All books","books",
  ()=>Object.entries(BOOKS).filter(([c,b])=>!selAuthors.size||selAuthors.has(b.a)).map(([c,b])=>[c,b.n]),selBooks,render);
buildMS(document.getElementById("authorDD"),"All authors","authors",()=>AUTHORS.map(a=>[a,a]),selAuthors,()=>{drawBooks();render()});
buildMS(document.getElementById("bandDD"),"All scores","ranges",()=>BANDS,selBands,render);
document.addEventListener("click",e=>{document.querySelectorAll("details.ms[open]").forEach(d=>{if(!d.contains(e.target))d.open=false})});
q.addEventListener("input",render);

res.addEventListener("click",e=>{
  // Favourite toggle
  const starBtn=e.target.closest(".s");
  if(starBtn){
    const id=ALL[+starBtn.dataset.i].id;
    if(favs.has(id))favs.delete(id);else favs.add(id);
    saveFavs();render();
    return;
  }
  // Zoe score edit
  const scBtn=e.target.closest(".sc");
  if(scBtn){
    const idx=+scBtn.dataset.i;
    const id=ALL[idx].id;
    const cur=scores[id]!==undefined?scores[id]:'';
    const inp=document.createElement("input");
    inp.type="number";inp.min=0;inp.max=99;inp.value=cur;
    inp.className="sc-inp";inp.placeholder="0-99";
    const wrap=document.createElement("span");wrap.className="sc-wrap";wrap.appendChild(inp);
    let clr=null;
    if(cur!==''){
      clr=document.createElement("button");clr.type="button";clr.className="sc-clr";clr.textContent="\u00d7";
      clr.setAttribute("aria-label","Remove Zoe score");clr.title="Remove score";
      wrap.appendChild(clr);
    }
    scBtn.replaceWith(wrap);
    inp.focus();if(cur!=='')inp.select();
    let saved=false;
    function save(){
      if(saved)return;saved=true;
      const v=inp.value.trim();
      if(v===''){delete scores[id];}
      else{const n=Math.min(99,Math.max(0,parseInt(v,10)));if(!isNaN(n))scores[id]=n;else delete scores[id];}
      saveScores();render();
    }
    if(clr){
      clr.addEventListener("pointerdown",ev=>ev.preventDefault());
      clr.addEventListener("click",ev=>{ev.stopPropagation();saved=true;delete scores[id];saveScores();render();});
    }
    inp.addEventListener("blur",ev=>{if(clr&&ev.relatedTarget===clr)return;save();});
    inp.addEventListener("keydown",ev=>{
      if(ev.key==="Enter"){ev.preventDefault();inp.blur();}
      if(ev.key==="Escape"){saved=true;wrap.replaceWith(scBtn);}
    });
  }
});

document.getElementById("favbtn").onclick=()=>{favOnly=!favOnly;render()};
document.getElementById("zoebtn").onclick=()=>{zoeOnly=!zoeOnly;render()};

render();
</script>
